<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview das logos dos bancos</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1e3c72, #2a5298); min-height: 100vh; padding: 20px; color: #333; }
  .wrap { max-width: 520px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  h1 { color: #2a5298; font-size: 1.4em; margin-bottom: 6px; }
  p.sub { color: #666; font-size: 0.9em; margin-bottom: 18px; }
  .box-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .box-card { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #f8f9fb; border: 1px solid #eef0f4; border-radius: 10px; }
  .box-avatar { flex: 0 0 42px; width: 42px; height: 42px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 0.95em; letter-spacing: 0.3px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
  .box-avatar.emoji { font-size: 1.35em; }
  .box-logo { flex: 0 0 42px; width: 42px; height: 42px; border-radius: 50%; object-fit: contain; background: #fff; padding: 3px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08); }
  .box-card-main { flex: 1; min-width: 0; }
  .box-card-name { display: block; font-weight: 600; color: #2a3a4f; }
  .box-card-sub { display: block; font-size: 0.78em; color: #999; margin-top: 2px; }
  .hidden { display: none !important; }
  .note { margin-top: 16px; font-size: 0.8em; color: #999; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>💼 Preview das logos</h1>
  <p class="sub">Como cada banco aparece no caixa. (Página só de teste — não mexe nos seus dados.)</p>
  <ul class="box-list" id="list"></ul>
  <div class="note">Sem logo no arquivo? Aparece o círculo colorido com a sigla.</div>
</div>

<script>
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const BANK_BRANDS = [
  { kw: ['dinheiro', 'carteira', 'espécie', 'especie', 'cash', 'vivo', 'em maos', 'em mãos'], emoji: '💵', bg: '#27ae60' },
  { kw: ['poupança', 'poupanca', 'cofre', 'reserva'], emoji: '🐷', bg: '#e84393' },
  { kw: ['bradesco'], label: 'B', bg: '#CC092F', logo: 'bradesco.png' },
  { kw: ['banco do brasil', 'brasil', ' bb', 'bb '], label: 'BB', bg: '#0033A0', logo: 'bb.png' },
  { kw: ['brb'], label: 'BRB', bg: '#0067B1', logo: 'brb.png' },
  { kw: ['c6'], label: 'C6', bg: '#1C1C1C', logo: 'c6.png' },
  { kw: ['nubank', 'nu '], label: 'Nu', bg: '#820AD1', logo: 'nubank.png' },
  { kw: ['itau', 'itaú'], label: 'Itaú', bg: '#EC7000', logo: 'itau.png' },
  { kw: ['santander'], label: 'S', bg: '#EC0000', logo: 'santander.png' },
  { kw: ['caixa'], label: 'CEF', bg: '#0070B8', logo: 'caixa.png' },
  { kw: ['inter'], label: 'I', bg: '#FF7A00', logo: 'inter.png' },
  { kw: ['picpay'], label: 'PP', bg: '#11C76F', logo: 'picpay.png' },
  { kw: ['mercado', ' mp', 'mpago'], label: 'MP', bg: '#00B1EA', logo: 'mercadopago.png' },
  { kw: ['pagbank', 'pagseguro', 'pagpag'], label: 'Pag', bg: '#11A557', logo: 'pagbank.png' },
  { kw: ['original'], label: 'O', bg: '#00A859', logo: 'original.png' },
  { kw: ['neon'], label: 'Ne', bg: '#00C6CF', logo: 'neon.png' },
  { kw: ['next'], label: 'Nx', bg: '#00C49A', logo: 'next.png' },
  { kw: ['will'], label: 'W', bg: '#F5B700', logo: 'will.png' },
  { kw: ['safra'], label: 'Sf', bg: '#1B2A4A', logo: 'safra.png' },
  { kw: ['sicoob'], label: 'Sc', bg: '#003641', logo: 'sicoob.png' },
  { kw: ['sicredi'], label: 'Sr', bg: '#3DAE2B', logo: 'sicredi.png' },
  { kw: ['banrisul'], label: 'Br', bg: '#0A5BA0', logo: 'banrisul.png' },
  { kw: ['paypal'], label: 'PP', bg: '#003087', logo: 'paypal.png' },
];

function boxAvatar(name) {
  const n = (' ' + (name || '').toLowerCase() + ' ');
  for (const b of BANK_BRANDS) {
    if (b.kw.some(k => n.includes(k))) {
      const fb = b.emoji
        ? `<span class="box-avatar emoji${b.logo ? ' hidden' : ''}" style="background:${b.bg}">${b.emoji}</span>`
        : `<span class="box-avatar${b.logo ? ' hidden' : ''}" style="background:${b.bg}">${b.label}</span>`;
      if (b.logo) {
        return `<img class="box-logo" src="/logos/${b.logo}" alt="${escapeHtml(name)}" onerror="this.classList.add('hidden');this.nextElementSibling.classList.remove('hidden')">${fb}`;
      }
      return fb;
    }
  }
  const palette = ['#2a5298', '#8e44ad', '#16a085', '#d35400', '#2c3e50', '#c0392b', '#2980b9'];
  let h = 0;
  for (const c of n) h = (h + c.charCodeAt(0)) % palette.length;
  const letter = (name || '?').trim().charAt(0).toUpperCase() || '🏦';
  return `<span class="box-avatar" style="background:${palette[h]}">${escapeHtml(letter)}</span>`;
}

// Um nome representativo para cada banco da lista
const NOMES = [
  'Dinheiro', 'Poupança', 'Bradesco', 'Banco do Brasil', 'BRB', 'C6', 'Nubank',
  'Itaú', 'Santander', 'Caixa', 'Inter', 'PicPay', 'Mercado Pago', 'PagBank',
  'Original', 'Neon', 'Next', 'Will', 'Safra', 'Sicoob', 'Sicredi', 'Banrisul', 'PayPal'
];

document.getElementById('list').innerHTML = NOMES.map(nome => `
  <li class="box-card">
    ${boxAvatar(nome)}
    <div class="box-card-main">
      <span class="box-card-name">${escapeHtml(nome)}</span>
      <span class="box-card-sub">R$ 1.000,00</span>
    </div>
  </li>
`).join('');
</script>
</body>
</html>
